; Simon Says for ESP32-2432S028 (CYD)
; TFT_eSPI is configured entirely via build_flags so the library's own
; User_Setup.h is never loaded (USER_SETUP_LOADED suppresses it).

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

upload_port     = COM18
monitor_port    = COM18
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    ; --- tell TFT_eSPI to skip its own setup file ---
    -DUSER_SETUP_LOADED=1

    ; --- swap native w/h so rotation 2 gives 320x240 landscape coords ---
    ; This board has the ILI9341 GRAM wired landscape-first (rows/cols swapped
    ; vs the standard CYD pinout), so MV=0 rotations show physical landscape.
    ; Overriding TFT_WIDTH/HEIGHT makes TFT_eSPI report 320x240 for rotation 2.
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=240

    ; --- display driver ---
    -DILI9341_DRIVER=1

    ; --- SPI pins (VSPI remapped for CYD) ---
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=1

    ; --- fonts ---
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

    ; --- SPI clock speeds ---
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
