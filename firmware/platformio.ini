[env:esp32s3]
platform  = espressif32@6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

; --- Serial ---
monitor_speed = 115200
upload_speed  = 115200
upload_port   = COM19
monitor_port  = COM19

; --- Flash / Filesystem ---
; Uses the "spiffs" partition but formatted as LittleFS for web UI files.
; If your board has 16 MB flash, change to default_16MB.csv
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.psram = enabled
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; --- USB ---
; If your board uses native USB-CDC (no CP2102), uncomment these two lines:
; build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1

; --- Libraries ---
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.0
    earlephilhower/ESP8266Audio @ 2.2.0
    adafruit/Adafruit NeoPixel @ 1.15.5

; --- Build flags ---
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

build_src_filter =
    +<main.cpp>
    +<DisplayDriver.cpp>
    +<TouchController.cpp>
    +<JukeboxUI.cpp>
    +<Theme.cpp>
    +<PinballGame.cpp>
    +<AirHockeyGame.cpp>
    +<SongLibrary.cpp>
    +<AudioController.cpp>
    +<Es8311Codec.cpp>
    +<JukeboxAudioOutput.cpp>
    +<StatusLed.cpp>

; --- OPI PSRAM (ESP32-S3 N16R8 — 8MB embedded OPI PSRAM) ---
board_build.arduino.memory_type = qio_opi

; --- One-off diagnostic: find which GPIO drives the onboard RGB LED. ---
; Flash with: pio run -e rgb_finder -t upload
; Does not touch the jukebox firmware; re-flash [env:esp32s3] afterwards.
[env:rgb_finder]
extends = env:esp32s3
build_src_filter =
    +<RgbPinFinder.cpp>

; --- Hardware diagnostic for student assembly verification ---
; Flash with: pio run -e diagtest -t upload
; Shows SD card status, song list, and button states on screen.
[env:diagtest]
extends = env:esp32s3
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.0
    adafruit/Adafruit NeoPixel @ 1.15.5
build_src_filter =
    +<DiagTest.cpp>
    +<DisplayDriver.cpp>

; --- Standalone pinball game (also playable from the jukebox's GAMES
; tab without reflashing — this env is only for a dedicated "arcade
; cabinet" flash with nothing else on it). ---
; Flash with: pio run -e pinball -t upload
; LEFT flipper = PLAY/PAUSE button (IO46), RIGHT flipper = NEXT button (IO45).
; Re-flash [env:esp32s3] afterwards to get the jukebox back.
[env:pinball]
extends = env:esp32s3
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.0
build_src_filter =
    +<PinballMain.cpp>
    +<PinballGame.cpp>
    +<DisplayDriver.cpp>

; --- Standalone air hockey game (also playable from the jukebox's
; GAMES tab without reflashing — see the pinball env's comment above,
; same idea). ---
; Flash with: pio run -e airhockey -t upload
; Paddle up = PLAY/PAUSE button (IO46), paddle down = NEXT button (IO45).
; Re-flash [env:esp32s3] afterwards to get the jukebox back.
[env:airhockey]
extends = env:esp32s3
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.0
build_src_filter =
    +<AirHockeyMain.cpp>
    +<AirHockeyGame.cpp>
    +<DisplayDriver.cpp>
